---
#---------------------------------------------------------------------------------------
# This role will deploy Kubernetes Applications in the cluster-admin-talos
#---------------------------------------------------------------------------------------
- hosts: all
  gather_facts: false
  strategy: free
  vars:
    creds_store: "{{ lookup('file', ansible_secret) | from_yaml }}"

  roles:
    - kubeapp-essentials
    - kubeapp-cilium_ippool
    - kubeapp-cilium_gateway
    - kubeapp-rook
    - kubeapp-promstack
    - kubeapp-headlamp
