---
#Source: https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
###############################################
# AlertManager HTTPROUTE
###############################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-http
  namespace: monitoring
spec:
  parentRefs:
    - name: shared-gtw
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: evocloud-ns
      sectionName: http-alertmanager
  hostnames:
    - alertmanager.{{ domain_tld }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-https
  namespace: monitoring
spec:
  parentRefs:
    - name: shared-gtw
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: evocloud-ns
      sectionName: https-alertmanager
  hostnames:
    - alertmanager.{{ domain_tld }}
  rules:
    - backendRefs:
        - name: kube-promstack-operator-ku-alertmanager
          port: 9093
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /
