---
#Source: https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
###############################################
# Grafana HTTPROUTE
###############################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-http
  namespace: monitoring
spec:
  parentRefs:
    - name: shared-gtw
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: evocloud-ns
      sectionName: http-grafana
  hostnames:
    - grafana.{{ domain_tld }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-https
  namespace: monitoring
spec:
  parentRefs:
    - name: shared-gtw
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: evocloud-ns
      sectionName: https-grafana
  hostnames:
    - grafana.{{ domain_tld }}
  rules:
    - backendRefs:
        - name: kube-promstack-operator-grafana
          port: 80
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /
