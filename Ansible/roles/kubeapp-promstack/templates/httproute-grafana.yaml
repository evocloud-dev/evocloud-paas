---
#Source: https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
###############################################
# Grafana HTTPROUTE
###############################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-http
  namespace: monitoring
spec:
  parentRefs:
    - name: shared-gtw
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: evocloud-ns
      sectionName: http-monitoring
  hostnames:
    - monitoring.{{ domain_tld }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-https
  namespace: monitoring
  annotations:
    #https://github.com/stakater/Forecastle/blob/master/pkg/annotations/annotations.go
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/icon: "https://github.com/stakater/ForecastleIcons/raw/master/grafana.png"
    forecastle.stakater.com/appName: "Monitoring UI"
    forecastle.stakater.com/group: "Tracing & Observability"
    forecastle.stakater.com/instance: "Evodashboard"
    forecastle.stakater.com/properties: "Platform:EvoCloud, Version:1.0.0"
    forecastle.stakater.com/network-restricted: "true"
spec:
  parentRefs:
    - name: shared-gtw
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: evocloud-ns
      sectionName: https-monitoring
  hostnames:
    - monitoring.{{ domain_tld }}
  rules:
    - backendRefs:
        - name: kube-promstack-operator-grafana
          port: 80
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /
