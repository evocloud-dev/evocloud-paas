---
#This playbook will deploy OpenCost
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-opencost ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ opencost_kubeapp_dir }}"

######################################################
#Deploying OpenCost Resources
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ opencost_kubeapp_dir }}/{{ item }}"
  loop:
    - opencost-rset.yaml

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ opencost_kubeapp_dir }}/opencost-rset.yaml"
  register: opencost_deploy_result
  until: opencost_deploy_result is succeeded
  retries: 10
  delay: 30
