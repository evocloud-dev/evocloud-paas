---
############################################
#DEPLOYING Cloudnative-PG
############################################
#Reference:
#           https://cloudnative-pg.io/docs/1.28/image_catalog/

# https://kubernetes-schemas.pages.dev/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cloudnative-pg-plugin-barman
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "20m"
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: FluxInstance
      name: flux
      namespace: flux-system
      ready: true
    #Requirement for storageclass
    #Requirement for cert-manager
    #Requirement for cloudnative-pg-operator
  resources:
    ##############################################################################
    # OCI Repository
    ##############################################################################
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: cloudnative-pg-plugin-barman
        namespace: flux-system
      spec:
        interval: 12h
        url: oci://ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
        layerSelector:
          mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
          operation: copy
        ref:
          semver: "0.8.*"
        verify:
          provider: cosign
          matchOIDCIdentity:
            - issuer: ^https://token\.actions\.githubusercontent\.com$
              subject: ^https://github\.com/cloudnative-pg/charts.*$

    ##############################################################################
    # Helm Release
    ##############################################################################
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: cloudnative-pg-plugin-barman
        namespace: cnpg-system
      spec:
        #serviceAccountName: cloudnative-pg-sa
        chartRef:
          kind: OCIRepository
          name: cloudnative-pg-plugin-barman
          namespace: flux-system
        interval: 30m
        timeout: 15m0s
        install:
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 2
        driftDetection:
          mode: enabled
        values:
          logLevel: error

    ##############################################################################
    # Network policy
    ##############################################################################
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: cloudnative-pg-plugin-barman
      spec:
        # The object-store traffic runs in the instance pods' sidecar.
        # apiserver egress comes from the apiserver-clients CCNP.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/instance: plugin-barman-cloud
            app.kubernetes.io/name: plugin-barman-cloud
        ingress:
          - fromEndpoints:
              - matchLabels:
                  app.kubernetes.io/name: cloudnative-pg
            toPorts:
              - ports:
                  - { port: "9090", protocol: TCP }
        egress:
          - {}