---
#This playbook will deploy External_Secrets Operator
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-external_secrets ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ external_secrets_kubeapp_dir }}"

######################################################
#Deploying External_Secrets Resources
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ external_secrets_kubeapp_dir }}/{{ item }}"
  loop:
    - external-secrets-rset.yaml

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ external_secrets_kubeapp_dir }}/external-secrets-rset.yaml"
  register: externaldns_deploy_result
  until: externaldns_deploy_result is succeeded
  retries: 10
  delay: 30
