---
############################################
#DEPLOYING Cloudnative-PG Images Catalog
############################################
#Reference: https://github.com/cloudnative-pg/artifacts/tree/main/image-catalogs
#           https://github.com/cloudnative-pg/artifacts/blob/main/image-catalogs/catalog-minimal-trixie.yaml
#           https://cloudnative-pg.io/docs/1.30/image_catalog

# https://kubernetes-schemas.pages.dev/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cnpg-image-catalog-base
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "20m"
spec:
  dependsOn:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg-operator
      namespace: cnpg-system
      ready: true
  resources:
    # Cloudnative-pg ImageCatalog:
    # https://cloudnative-pg.io/docs/1.28/image_catalog/
    - apiVersion: postgresql.cnpg.io/v1
      kind: ClusterImageCatalog
      metadata:
        name: postgresql-minimal-trixie-base
        labels:
          images.cnpg.io/family: postgresql
          images.cnpg.io/os: trixie
          images.cnpg.io/type: minimal
      spec:
        # PostgreSQL major versions - OCI images
        images:
          - major: 16
            image: ghcr.io/cloudnative-pg/postgresql:16.15-202610120828-minimal-trixie@sha256:5e44466914a2de2bf0f1d8eec1388f31f42bacab71454a4a2ea20c31284e617e
          - major: 17
            image: ghcr.io/cloudnative-pg/postgresql:17.11-202610120828-minimal-trixie@sha256:e1f13bf01149991575399038559935f839686073e0f18255a28ec68a3d283568
          #Starting with PostgreSQL 18 (and CloudNativePG 1.29+), you can attach extension images as read-only volumes instead of baking the extensions into the main PostgreSQL image.
          - major: 18
            image: ghcr.io/cloudnative-pg/postgresql:18.6-202610120828-minimal-trixie@sha256:c9be7f221a05b18fe65259d9136affbabe3b39ad91c3b68f8f2f990a45f35f38

        # Component images – this is what the Pooler will use
        componentImages:
          - key: pgbouncer
            image: ghcr.io/cloudnative-pg/pgbouncer:1.26.0@sha256:ce54f1133c509f1db8a8092c3f1c761d8c9292065ed6b6698786bb966da4dab9
