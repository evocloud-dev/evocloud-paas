---
#This playbook will deploy Falco Runtime Security
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-falco ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ falco_kubeapp_dir }}"

######################################################
#Deploying Falco Resources
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ falco_kubeapp_dir }}/{{ item }}"
  loop:
    - falco-rset.yaml

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ falco_kubeapp_dir }}/falco-rset.yaml"
  register: falco_deploy_result
  until: falco_deploy_result is succeeded
  retries: 10
  delay: 30
