---
#This playbook will deploy EvoCloud Kubeapps EvoDesktop
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-evodesktop ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ evodesktop_kubeapp_dir }}"

######################################################
#Deploying EvoDesktop Resources
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ evodesktop_kubeapp_dir }}/{{ item }}"
  loop:
    - evodesktop-rset.yaml

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ evodesktop_kubeapp_dir }}/evodesktop-rset.yaml"
  register: evodesktop_deploy_result
  until: evodesktop_deploy_result is succeeded
  retries: 10
  delay: 30
