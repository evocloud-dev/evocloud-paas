---
#This playbook will deploy STRIMZI
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-strimzi ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ strimzi_kubeapp_dir }}"

######################################################
#Deploying STRIMZI Resources
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ strimzi_kubeapp_dir }}/{{ item }}"
  loop:
    - strimzi-rset.yaml

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ strimzi_kubeapp_dir }}/strimzi-rset.yaml"
  register: strimzi_deploy_result
  until: strimzi_deploy_result is succeeded
  retries: 10
  delay: 30
