---
#This playbook will deploy Dragonfly
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-dragonfly ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ kubeapp_dir }}/{{ kubeapp_name }}"

######################################################
#Deploying Dragonfly
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ kubeapp_dir }}/{{ kubeapp_name }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
  loop: "{{ query('fileglob', 'templates/*.yaml.j2') }}"

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ kubeapp_dir }}/{{ kubeapp_name }}/{{ kubeapp_name }}-rset.yaml"
  register: dragonfly_deploy_result
  until: dragonfly_deploy_result is succeeded
  retries: 4
  delay: 30