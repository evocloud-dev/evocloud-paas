---
#Source: https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
###############################################
# Dragonfly Manager HTTPROUTE
###############################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dragonfly-http
  namespace: dragonfly-system
spec:
  parentRefs:
    - name: shared-gtw
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: evocloud-ns
      sectionName: http-dragonfly
  hostnames:
    - dragonfly.{{ domain_tld }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dragonfly-https
  namespace: dragonfly
  annotations:
    #https://github.com/stakater/Forecastle/blob/master/pkg/annotations/annotations.go
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/icon: "https://d7y.io/img/logo.svg"
    forecastle.stakater.com/appName: "Dragonfly P2P"
    forecastle.stakater.com/group: "APIs & Interfaces"
    forecastle.stakater.com/instance: "Evodashboard"
    forecastle.stakater.com/properties: "Platform:EvoCloud, Version:1.0.0"
    forecastle.stakater.com/network-restricted: "true"
spec:
  parentRefs:
    - name: shared-gtw
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: evocloud-ns
      sectionName: https-dragonfly
  hostnames:
    - dragonfly.{{ domain_tld }}
  rules:
    - backendRefs:
        - name: dragonfly-manager
          port: 8080
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /