---
#This playbook will deploy Kubescape
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-kubescape ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ kubescape_kubeapp_dir }}"

######################################################
#Deploying Kubescape Resources
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ kubescape_kubeapp_dir }}/{{ item }}"
  loop:
    - kubescape-rset.yaml

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ kubescape_kubeapp_dir }}/kubescape-rset.yaml"
  register: kubescape_deploy_result
  until: kubescape_deploy_result is succeeded
  retries: 10
  delay: 30
