---
############################################
#DEPLOYING Cloudnative-PG Operator
############################################
#Reference: https://github.com/cloudnative-pg/charts/tree/main/charts/cloudnative-pg

# https://kubernetes-schemas.pages.dev/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cloudnative-pg-operator
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "20m"
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: FluxInstance
      name: flux
      namespace: flux-system
      ready: true
    #Requirement for storageclass
    #Requirement for cert-manager
    #Requirement for external-secrets
    #Requirement for promstack
  resources:
    ###############################################################################
    # Prerequesites
    ###############################################################################
    # Namespace
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: cnpg-system
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted

    ##############################################################################
    # OCI Repository
    ##############################################################################
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: cloudnative-pg-operator
        namespace: flux-system
      spec:
        interval: 12h
        url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
        layerSelector:
          mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
          operation: copy
        ref:
          semver: "0.29.*"
        verify:
          provider: cosign
          matchOIDCIdentity:
            - issuer: ^https://token\.actions\.githubusercontent\.com$
              subject: ^https://github\.com/cloudnative-pg/charts.*$

    ##############################################################################
    # Helm Release
    ##############################################################################
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: cloudnative-pg-operator
        namespace: cnpg-system
      spec:
        #serviceAccountName: cloudnative-pg-sa
        chartRef:
          kind: OCIRepository
          name: cloudnative-pg-operator
          namespace: flux-system
        interval: 30m
        timeout: 15m0s
        install:
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 2
        driftDetection:
          mode: enabled
        values:
          crds:
            create: true
          replicaCount: 2
          monitoring:
            podMonitorEnabled: true

    ##############################################################################
    # Secret generator
    ##############################################################################
    - apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      metadata:
        name: cnpg-pass-generator
      spec:
        kind: Password
        generator:
          passwordSpec:
            length: 42
            digits: 5
            symbols: 5
            symbolCharacters: "-_$"
            noUpper: false
            allowRepeat: true

    ##############################################################################
    # Network policy
    ##############################################################################
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: cloudnative-pg-operator
        namespace: cnpg-system
      spec:
        # apiserver egress comes from the apiserver-clients CCNP
        endpointSelector:
          matchLabels:
            app.kubernetes.io/instance: cloudnative-pg
            app.kubernetes.io/name: cloudnative-pg
        ingress:
          # Mutating/validating webhooks (Service 443 -> 9443)
          - fromEntities:
              - kube-apiserver
            toPorts:
              - ports:
                  - { port: "9443", protocol: TCP }
        egress:
          # Instance manager status/control, for Clusters in any namespace
          - toEndpoints:
              - matchLabels:
                  cnpg.io/podRole: instance
                matchExpressions:
                  - { key: 'k8s:io.kubernetes.pod.namespace', operator: Exists }
            toPorts:
              - ports:
                  - { port: "8000", protocol: TCP }
                  - { port: "5432", protocol: TCP }
          # barman-cloud plugin gRPC
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/name: plugin-barman-cloud
            toPorts:
              - ports:
                  - { port: "9090", protocol: TCP }

    ##############################################################################
    # Monitoring dashboard - Grafana
    ##############################################################################
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaDashboard
      metadata:
        name: cloudnative-pg-operator
      spec:
        allowCrossNamespaceImport: true
        instanceSelector:
          matchLabels:
            dashboards: grafana
        datasources:
          - datasourceName: prometheus
            inputName: DS_PROMETHEUS
        url: https://grafana.com/api/dashboards/20417/revisions/4/download
