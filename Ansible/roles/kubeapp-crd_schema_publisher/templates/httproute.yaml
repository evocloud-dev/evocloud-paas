---
#Source: https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
###############################################
# CRD_SCHEMA_PUBLISHER HTTPROUTE
###############################################
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crdpublisher-http
  namespace: kube-system
spec:
  parentRefs:
    - name: shared-gtw
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: evocloud-ns
      sectionName: http-crd-schema-publisher
  hostnames:
    - api.{{ domain_tld }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crdpublisher-https
  namespace: evocloud-ns
  annotations:
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/icon: "https://github.com/stakater/ForecastleIcons/raw/master/grafana.png"
    forecastle.stakater.com/appName: "CRDs Schema"
    forecastle.stakater.com/group: "APIs & Interfaces"
    forecastle.stakater.com/instance: "Evodashboard"
    forecastle.stakater.com/properties: "Platform:EvoCloud, Version:1.0.0"
    forecastle.stakater.com/network-restricted: "true"
spec:
  parentRefs:
    - name: shared-gtw
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: evocloud-ns
      sectionName: https-crd-schema-publisher
  hostnames:
    - api.{{ domain_tld }}
  rules:
    - backendRefs:
        - name: crd-publisher-operator-crd-schema-publisher
          port: 8081
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /
