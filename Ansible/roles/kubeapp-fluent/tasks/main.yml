---
#This playbook will Fluent Operator for managing FluentBit and Fluentd with Custom Resources
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-fluent ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ fluent_kubeapp_dir }}"

######################################################
#Deploying Fluent Operator Resources
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ fluent_kubeapp_dir }}/{{ item }}"
  loop:
    - fluent-operator-rset.yaml

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ fluent_kubeapp_dir }}/fluent-operator-rset.yaml"
  register: fluent_deploy_result
  until: fluent_deploy_result is succeeded
  retries: 10
  delay: 30
