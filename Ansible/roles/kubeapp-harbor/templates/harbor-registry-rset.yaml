############################################
#DEPLOYING Harbor Registry
############################################
# Reference: https://github.com/goharbor/harbor-helm

apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: harbor-registry
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "20m"
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: FluxInstance
      name: flux
      namespace: flux-system
      ready: true
    # Add dependsOn storageClass

  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: harbor-system
        labels:
          pod-security.kubernetes.io/enforce: privileged

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: harbor-registry
        namespace: flux-system
      spec:
        interval: 12h
        url: oci://ghcr.io/evocloud-dev/charts/harbor
        layerSelector:
          mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
          operation: copy
        ref:
          semver: "1.19.*"
        #cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp 'https://github\.com/action-stars/helm-workflows/\.github/workflows/release\.yaml@.+' --certificate-github-workflow-repository fluent/helm-charts --certificate-github-workflow-name Release ghcr.io/fluent/helm-charts/fluent-operator:4.2.0
        #verify:
        #  provider: cosign
        #  matchOIDCIdentity:
        #    - issuer: ^https://token\.actions\.githubusercontent\.com$
        #      subject: ^https://github\.com/action-stars/helm-workflows/\.github/workflows/release\.yaml@.+$

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: harbor-registry
        namespace: harbor-system
      spec:
        #serviceAccountName: harbor-operator
        chartRef:
          kind: OCIRepository
          name: harbor-registry
          namespace: flux-system
        interval: 30m
        timeout: 15m0s
        install:
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 2
        driftDetection:
          mode: enabled
        #https://github.com/goharbor/harbor-helm/blob/main/values.yaml
        values:
          expose:
            type: clusterIP #ingress, clusterIP, nodePort, loadBalancer or route