---
#This playbook will deploy Harbor
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-harbor ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ kubeapp_dir }}/harbor"

######################################################
#Deploying Rook Storage Cluster
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ kubeapp_dir }}/harbor/{{ item }}"
  loop:
    - harbor-rset.yaml

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ kubeapp_dir }}/harbor/harbor-rset.yaml"
  register: harbor_deploy_result
  until: harbor_deploy_result is succeeded
  retries: 4
  delay: 30
