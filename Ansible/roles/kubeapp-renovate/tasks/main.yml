---
#This playbook will deploy Renovate
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-renovate ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ renovate_kubeapp_dir }}"

######################################################
#Deploying Renovate Resources
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ renovate_kubeapp_dir }}/{{ item }}"
  loop:
    - renovate-rset.yaml

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ renovate_kubeapp_dir }}/renovate-rset.yaml"
  register: renovate_deploy_result
  until: renovate_deploy_result is succeeded
  retries: 10
  delay: 30
