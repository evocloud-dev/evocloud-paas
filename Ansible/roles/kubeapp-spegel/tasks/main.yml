---
#This playbook will deploy Spegel Local OCI Image Mirroring
#References:

- ansible.builtin.debug:
    msg: "########### STARTING ANSIBLE ROLE: kubeapp-spegel ##############"

- name: Creating directories for manifest files...
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ spegel_kubeapp_dir }}"

######################################################
#Deploying Spegel Resources
######################################################
- name: Staging Kubernetes manifests...
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ spegel_kubeapp_dir }}/{{ item }}"
  loop:
    - spegel-rset.yaml

- name: Deploying Kubernetes manifests...
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    src: "{{ item }}"
  loop:
    - "{{ spegel_kubeapp_dir }}/spegel-rset.yaml"
  register: spegel_deploy_result
  until: spegel_deploy_result is succeeded
  retries: 10
  delay: 30
